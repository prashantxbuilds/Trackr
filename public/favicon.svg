<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded Background -->
  <rect width="100" height="100" rx="24" fill="#FDFBF7"/>

  <!-- Left Star Sparkle -->
  <path d="M25 45C25 42 27 40 30 40C27 40 25 38 25 35C25 38 23 40 20 40C23 40 25 42 25 45Z" fill="#1B3B36"/>

  <!-- Right Star Sparkle -->
  <path d="M75 33C75 30 77 28 80 28C77 28 75 26 75 23C75 26 73 28 70 28C73 28 75 30 75 33Z" fill="#1B3B36"/>

  <!-- Top Yellow Bill (Angled ~45 deg) -->
  <g transform="translate(50, 48) rotate(-42) translate(-50, -48)">
    <rect x="36" y="24" width="30" height="42" rx="3" fill="#E9C46A" stroke="#1B3B36" stroke-width="2.5"/>
    <circle cx="51" cy="45" r="4" fill="none" stroke="#1B3B36" stroke-width="2"/>
    <text x="51" y="37" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1B3B36" text-anchor="middle">$</text>
    <line x1="36" y1="41" x2="66" y2="41" stroke="#1B3B36" stroke-width="2"/>
  </g>

  <!-- Middle Yellow Bill (Angled ~-30 deg) -->
  <g transform="translate(48, 52) rotate(-20) translate(-48, -52)">
    <rect x="34" y="30" width="32" height="42" rx="3" fill="#F4A261" stroke="#1B3B36" stroke-width="2.5"/>
    <circle cx="50" cy="50" r="4" fill="none" stroke="#1B3B36" stroke-width="2"/>
  </g>

  <!-- Front Teal Banknote -->
  <rect x="18" y="52" width="64" height="34" rx="4" fill="#2A9D8F" stroke="#1B3B36" stroke-width="3"/>
  
  <!-- Inner Decorative Border -->
  <path d="M23 57H77V81H23V57Z" fill="none" stroke="#1B3B36" stroke-width="1.8" stroke-dasharray="100" />
  <circle cx="23" cy="57" r="2.5" fill="#2A9D8F" stroke="#1B3B36" stroke-width="1.8"/>
  <circle cx="77" cy="57" r="2.5" fill="#2A9D8F" stroke="#1B3B36" stroke-width="1.8"/>
  <circle cx="23" cy="81" r="2.5" fill="#2A9D8F" stroke="#1B3B36" stroke-width="1.8"/>
  <circle cx="77" cy="81" r="2.5" fill="#2A9D8F" stroke="#1B3B36" stroke-width="1.8"/>

  <!-- Center Circle & Dollar Sign -->
  <circle cx="50" cy="69" r="8" fill="#38B2A3" stroke="#1B3B36" stroke-width="2.2"/>
  <text x="50.2" y="74.5" font-family="'Inter', 'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#1B3B36" text-anchor="middle">$</text>

  <!-- Two Small Dots on Front Note -->
  <circle cx="32" cy="69" r="2.5" fill="#38B2A3" stroke="#1B3B36" stroke-width="1.5"/>
  <circle cx="68" cy="69" r="2.5" fill="#38B2A3" stroke="#1B3B36" stroke-width="1.5"/>
</svg>
